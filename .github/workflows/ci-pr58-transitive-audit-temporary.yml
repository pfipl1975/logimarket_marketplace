name: PR58 Transitive Security Gate (temporary)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/ci-pr58-transitive-audit-temporary.yml'
permissions:
  contents: read
concurrency:
  group: pr58-transitive-security-gate
  cancel-in-progress: true
jobs:
  security-gate:
    name: Generate and audit exact transitive remediation (no DB)
    if: github.event.pull_request.number == 58 && github.event.pull_request.head.ref == 'fix/lm-sec-dependencies-01' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: ${{ runner.temp }}/pr58-security-report
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact PR input and update only two transitive packages
        id: update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "main"
          test "$GITHUB_HEAD_REF" = "fix/lm-sec-dependencies-01"
          test "$(git rev-parse HEAD)" = "cd7f3c3d38615d439a7d66f4522d1f98474d3a28"
          test "$(git hash-object package.json)" = "ac42a8b2e47fa7df5f5a0b1d051e4c91b4da5e5c"
          test "$(git hash-object package-lock.json)" = "66c5b1899b4ac96b34060d7f9bd93705c10f1cec"
          npm --version | tee "$REPORT_DIR/npm-version.txt"
          node --version | tee "$REPORT_DIR/node-version.txt"
          npm update baseline-browser-mapping source-map-js --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
      - name: Assert zero unrelated dependency or metadata changes
        id: validate
        if: steps.update.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs"), cp = require("node:child_process");
          const original = JSON.parse(cp.execFileSync("git", ["show", "HEAD:package-lock.json"], {encoding: "utf8"}));
          const candidate = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const old = original.packages, now = candidate.packages;
          const target = new Map([["node_modules/baseline-browser-mapping","2.11.0"],["node_modules/source-map-js","1.2.2"]]);
          const added = Object.keys(now).filter(k => !(k in old));
          const removed = Object.keys(old).filter(k => !(k in now));
          const otherChanges = Object.keys(old).filter(k => k in now && !target.has(k) && JSON.stringify(old[k]) !== JSON.stringify(now[k]));
          const wrong = [...target].filter(([k,v])=> !now[k] || now[k].version !== v || !now[k].resolved || !now[k].integrity || old[k].version === v);
          const rootChanged = JSON.stringify(original) !== JSON.stringify({...candidate, packages: original.packages});
          const report = {targetVersions:Object.fromEntries([...target].map(([k,v])=>[k,{from:old[k]?.version,to:now[k]?.version,requested:v}])),added,removed,otherChanges,wrong,rootChanged};
          fs.writeFileSync(process.env.REPORT_DIR+"/drift.json",JSON.stringify(report,null,2)+"\n");
          console.log(JSON.stringify({targets:report.targetVersions,addedCount:added.length,removedCount:removed.length,otherChangesCount:otherChanges.length,wrongCount:wrong.length,rootChanged}));
          if (added.length || removed.length || otherChanges.length || wrong.length || rootChanged) {
            console.error("STOP_UNCONTROLLED_LOCKFILE_DRIFT"); process.exitCode=1;
          } else {
            fs.copyFileSync("package-lock.json",process.env.REPORT_DIR+"/candidate-package-lock.json");
          }
          NODE
          test -z "$(git diff --name-only -- package.json)"
          git diff --check
      - name: Install exact lockfile (real npm ci)
        id: npm-ci
        if: steps.validate.outcome == 'success'
        run: npm ci --no-audit --no-fund
      - name: Production and complete npm vulnerability audit
        if: steps.npm-ci.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          npm audit --omit=dev --json --fetch-retries=0 > "$REPORT_DIR/audit-production.json"
          prod_exit=$?
          npm audit --json --fetch-retries=0 > "$REPORT_DIR/audit-all.json"
          full_exit=$?
          PROD_EXIT="$prod_exit" FULL_EXIT="$full_exit" node <<'NODE'
          const fs = require("node:fs");
          const folder=process.env.REPORT_DIR;
          const prod=JSON.parse(fs.readFileSync(folder+"/audit-production.json","utf8"));
          const all=JSON.parse(fs.readFileSync(folder+"/audit-all.json","utf8"));
          const counts=x=>x.metadata?.vulnerabilities;
          const report={production:counts(prod),full:counts(all),exitProduction:Number(process.env.PROD_EXIT),exitFull:Number(process.env.FULL_EXIT)};
          fs.writeFileSync(folder+"/audit-summary.json",JSON.stringify(report,null,2)+"\n");
          console.log("AUDIT_SUMMARY "+JSON.stringify(report));
          if (!counts(prod)||!counts(all)||prod.error||all.error||report.exitProduction!==0||counts(prod).total!==0) {
            console.error("STOP_PRODUCTION_AUDIT_OR_SERVICE_UNAVAILABLE");process.exitCode=1;
          }
          NODE
      - name: Save candidate and audit evidence without repository writes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr58-two-transitive-security-evidence
          path: ${{ runner.temp }}/pr58-security-report/
          if-no-files-found: warn
          retention-days: 3
