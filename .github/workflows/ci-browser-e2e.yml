name: Browser E2E Integration

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  e2e:
    name: Playwright Chromium E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: logimarket_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify isolated PostgreSQL 17 identity
        shell: bash
        env:
          PGPASSWORD: password
        run: |
          test "$CI" = "true" && test "$GITHUB_ACTIONS" = "true"
          version_num=$(psql -h localhost -U postgres -d logimarket_test -v ON_ERROR_STOP=1 -Atc "SHOW server_version_num")
          echo "PG_SERVER_VERSION_NUM=$version_num"
          test "$((version_num / 10000))" -eq 17
          test "$(psql -h localhost -U postgres -d logimarket_test -v ON_ERROR_STOP=1 -Atc "SELECT current_database()")" = "logimarket_test"
          psql -h localhost -U postgres -d logimarket_test -v ON_ERROR_STOP=1 -c "SELECT version() AS actual_postgresql_version, current_database() AS database, inet_server_addr() AS server_address, inet_server_port() AS server_port"

      - name: Install dependencies
        run: npm ci

      - name: Create isolated checkout confirmation key
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true" && test "$CI" = "true"
          checkout_key=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$checkout_key"
          echo "CHECKOUT_CONFIRMATION_SECRET=$checkout_key" >> "$GITHUB_ENV"

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Initialize Database Roles
        run: PGPASSWORD=password psql -h localhost -U postgres -d logimarket_test -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"

      - name: Run Runtime Migrations
        run: npm run db:runtime:migrate
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          RUNTIME_MIGRATION_TARGET: development
          RUNTIME_MIGRATION_EXPECTED_PROJECT_REF: localhost
          RUNTIME_MIGRATION_FORBIDDEN_PROJECT_REF: prodref
          RUNTIME_MIGRATION_WRITE_AUTHORIZATION: AUTHORIZED_DEV_BASELINE_WRITE
          RUNTIME_MIGRATION_ROLLBACK_AUTHORIZATION: AUTHORIZED_EMPTY_DEV_BASELINE_ROLLBACK

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Database contract gate
        run: |
          set -o pipefail
          mkdir -p gate-results
          node --import tsx tests/database/helpers/run-ci-database-gate.ts 2>&1 | tee gate-results/test-database.log
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          E2E_DB_CLASSIFICATION: ISOLATED_DISPOSABLE_TEST
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-fake-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-fake-service-key
          ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Retain redacted database gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-gate-diagnostics
          path: gate-results/test-database.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup E2E Fixtures
        run: npm run e2e:fixture:setup
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          E2E_DB_CLASSIFICATION: ISOLATED_DISPOSABLE_TEST

      - name: Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-fake-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-fake-service-key
          ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Start Mock GoTrue
        run: |
          node scripts/e2e/mock-gotrue.js &
          MOCK_PID=$!
          echo "MOCK_PID=$MOCK_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            if nc -z 127.0.0.1 54321 2>/dev/null; then
              echo "Mock GoTrue ready after $i attempt(s)"
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 54321 || { echo "Mock GoTrue failed to start"; exit 1; }

      - name: Run E2E Tests
        run: npm run test:e2e:ci
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-fake-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-fake-service-key
          ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          E2E_DB_CLASSIFICATION: ISOLATED_DISPOSABLE_TEST

      - name: Stop Mock GoTrue
        if: always()
        run: |
          if [ -n "$MOCK_PID" ]; then
            kill "$MOCK_PID" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
