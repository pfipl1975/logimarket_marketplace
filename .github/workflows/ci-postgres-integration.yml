name: Runtime Database Integration

on:
  push:
    branches:
      - "feat/lm-db-runtime-baseline-adoption-01"
      - "main"
  pull_request:

jobs:
  integration:
    name: Real PostgreSQL Integration Proof
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: logimarket_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify isolated PostgreSQL 17 identity
        shell: bash
        env:
          PGPASSWORD: password
        run: |
          test "$CI" = "true" && test "$GITHUB_ACTIONS" = "true"
          version_num=$(psql -h localhost -U postgres -d logimarket_test -v ON_ERROR_STOP=1 -Atc "SHOW server_version_num")
          echo "PG_SERVER_VERSION_NUM=$version_num"
          test "$((version_num / 10000))" -eq 17
          test "$(psql -h localhost -U postgres -d logimarket_test -v ON_ERROR_STOP=1 -Atc "SELECT current_database()")" = "logimarket_test"
          psql -h localhost -U postgres -d logimarket_test -v ON_ERROR_STOP=1 -c "SELECT version() AS actual_postgresql_version, current_database() AS database, inet_server_addr() AS server_address, inet_server_port() AS server_port"

      - name: Install dependencies
        run: npm ci

      - name: Create isolated checkout confirmation key
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true" && test "$CI" = "true"
          checkout_key=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$checkout_key"
          echo "CHECKOUT_CONFIRMATION_SECRET=$checkout_key" >> "$GITHUB_ENV"

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          ALLOW_DESTRUCTIVE_DB_TESTS: "1"
          NODE_ENV: test
          RUNTIME_MIGRATION_TARGET: development
          RUNTIME_MIGRATION_EXPECTED_PROJECT_REF: localhost
          RUNTIME_MIGRATION_FORBIDDEN_PROJECT_REF: prodref
          RUNTIME_MIGRATION_WRITE_AUTHORIZATION: AUTHORIZED_DEV_BASELINE_WRITE
          RUNTIME_MIGRATION_ROLLBACK_AUTHORIZATION: AUTHORIZED_EMPTY_DEV_BASELINE_ROLLBACK

      - name: Run Agreement Version DB Test
        run: npx tsx --test tests/database/agreement-version-db.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          ALLOW_DESTRUCTIVE_DB_TESTS: "1"
          NODE_ENV: test
          RUNTIME_MIGRATION_TARGET: development
          RUNTIME_MIGRATION_EXPECTED_PROJECT_REF: localhost
          RUNTIME_MIGRATION_FORBIDDEN_PROJECT_REF: prodref
          RUNTIME_MIGRATION_WRITE_AUTHORIZATION: AUTHORIZED_DEV_BASELINE_WRITE
          RUNTIME_MIGRATION_ROLLBACK_AUTHORIZATION: AUTHORIZED_EMPTY_DEV_BASELINE_ROLLBACK

      - name: Run Agreement Seller Readiness Flow Test
        run: npx tsx --test tests/database/agreement-seller-readiness-flow.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          ALLOW_DESTRUCTIVE_DB_TESTS: "1"
          NODE_ENV: test
          RUNTIME_MIGRATION_TARGET: development
          RUNTIME_MIGRATION_EXPECTED_PROJECT_REF: localhost
          RUNTIME_MIGRATION_FORBIDDEN_PROJECT_REF: prodref
          RUNTIME_MIGRATION_WRITE_AUTHORIZATION: AUTHORIZED_DEV_BASELINE_WRITE
          RUNTIME_MIGRATION_ROLLBACK_AUTHORIZATION: AUTHORIZED_EMPTY_DEV_BASELINE_ROLLBACK

      - name: Run Legal Registry Test
        run: npx tsx --test tests/database/legal-registry.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          ALLOW_DESTRUCTIVE_DB_TESTS: "1"
          NODE_ENV: test
          RUNTIME_MIGRATION_TARGET: development
          RUNTIME_MIGRATION_EXPECTED_PROJECT_REF: localhost
          RUNTIME_MIGRATION_FORBIDDEN_PROJECT_REF: prodref
          RUNTIME_MIGRATION_WRITE_AUTHORIZATION: AUTHORIZED_DEV_BASELINE_WRITE
          RUNTIME_MIGRATION_ROLLBACK_AUTHORIZATION: AUTHORIZED_EMPTY_DEV_BASELINE_ROLLBACK

      - name: Run Core Legal Pack v1 Publication Test
        run: npx tsx --conditions react-server --test tests/database/core-legal-pack-v1-publication.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          ALLOW_DESTRUCTIVE_DB_TESTS: "1"
          NODE_ENV: test
          RUNTIME_MIGRATION_TARGET: development
          RUNTIME_MIGRATION_EXPECTED_PROJECT_REF: localhost
          RUNTIME_MIGRATION_FORBIDDEN_PROJECT_REF: prodref
          RUNTIME_MIGRATION_WRITE_AUTHORIZATION: AUTHORIZED_DEV_BASELINE_WRITE
          RUNTIME_MIGRATION_ROLLBACK_AUTHORIZATION: AUTHORIZED_EMPTY_DEV_BASELINE_ROLLBACK

      - name: Verify production 0026 runner against isolated PostgreSQL
        run: npx tsx --test tests/database/production-0026-gate.test.ts
        env:
          PROD_0026_GATE_TEST_URL: postgres://postgres:password@localhost:5432/logimarket_test
          PROD_0026_GATE_TEST_CLASSIFICATION: DISPOSABLE_DEV
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/logimarket_test
          ALLOW_DESTRUCTIVE_DB_TESTS: "1"
          NODE_ENV: test
