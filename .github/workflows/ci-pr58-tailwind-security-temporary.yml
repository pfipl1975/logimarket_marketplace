name: PR58 Tailwind and DEV High Audit (temporary)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/ci-pr58-tailwind-security-temporary.yml'
permissions:
  contents: read
concurrency:
  group: pr58-tailwind-security-temporary
  cancel-in-progress: true
jobs:
  audit:
    name: Exact npm remediation of 4 development High issues (no DB)
    if: github.event.pull_request.number == 58 && github.event.pull_request.head.ref == 'fix/lm-sec-dependencies-01' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: /tmp/pr58-tailwind-security
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable PR baseline and npm update selected packages
        id: update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "main"
          test "$GITHUB_HEAD_REF" = "fix/lm-sec-dependencies-01"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git hash-object package.json)" = "ac42a8b2e47fa7df5f5a0b1d051e4c91b4da5e5c"
          test "$(git hash-object package-lock.json)" = "29575171cea7efddca889552deaa4b5cebc44d8b"
          node --version
          npm --version
          npm update @tailwindcss/postcss tailwindcss postcss brace-expansion browserslist js-yaml --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
      - name: Assert scope, versions, lockfile metadata and save evidence
        id: validate
        if: steps.update.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const after = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const older = before.packages, newer = after.packages;
          const oldPaths = Object.keys(older), newPaths = Object.keys(newer);
          const added = newPaths.filter(p => !(p in older));
          const removed = oldPaths.filter(p => !(p in newer));
          const changed = oldPaths.filter(p => p in newer && JSON.stringify(older[p]) !== JSON.stringify(newer[p]));
          const exact = new Set(['@tailwindcss/postcss','@tailwindcss/node','@tailwindcss/oxide','tailwindcss',
            'postcss','brace-expansion','browserslist','js-yaml','caniuse-lite','electron-to-chromium',
            'node-releases','update-browserslist-db','lightningcss']);
          const packageName = p => p.split('/node_modules/').pop().replace(/^node_modules\//,'');
          const allowed = p => {
            const name = packageName(p);
            return exact.has(name) || name.startsWith('@tailwindcss/oxide-') || name.startsWith('lightningcss-');
          };
          const unexpected = changed.filter(p => !allowed(p));
          const entry = p => newer['node_modules/'+p];
          const ge = (version, min) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version||'');
            if(!match) return false;
            const a=match.slice(1).map(Number),b=min.split('.').map(Number);
            for(let i=0;i<3;i++){if(a[i]>b[i])return true;if(a[i]<b[i])return false;}
            return true;
          };
          const requirements = [
            ['postcss','8.5.23'],['next/node_modules/postcss','8.5.23'],
            ['brace-expansion','1.1.21'],
            ['@typescript-eslint/typescript-estree/node_modules/brace-expansion','5.0.12'],
            ['browserslist','4.28.7'],['js-yaml','4.3.2'],
            ['@tailwindcss/postcss','4.3.3'],['tailwindcss','4.3.3'],
            ['@tailwindcss/node','4.3.3'],['@tailwindcss/oxide','4.3.3']
          ];
          const unsafe = requirements.filter(([p,v]) => !entry(p) || !ge(entry(p).version,v));
          const rootChanged = JSON.stringify({...after,packages:older}) !== JSON.stringify(before);
          const metadata = {added,removed,changed,unexpected,unsafe,rootChanged,
            targets:requirements.map(([p,min])=>({name:p,minimum:min,from:older['node_modules/'+p]?.version,to:entry(p)?.version}))};
          fs.writeFileSync(process.env.REPORT_DIR+'/drift.json',JSON.stringify(metadata,null,2)+'\n');
          console.log('DEV_HIGH_DRIFT '+JSON.stringify({added,removed,changed,unexpected,unsafe,rootChanged,targets:metadata.targets}));
          if(added.length||removed.length||unexpected.length||unsafe.length||rootChanged||!changed.includes('node_modules/postcss')||!changed.includes('node_modules/@tailwindcss/postcss')){
            console.error('STOP_UNCONTROLLED_DRIFT_OR_UNPATCHED_TARGET');process.exitCode=1;
          }else{
            fs.copyFileSync('package-lock.json',process.env.REPORT_DIR+'/candidate-package-lock.json');
            console.log('CANDIDATE_GIT_BLOB '+cp.execFileSync('git',['hash-object','package-lock.json'],{encoding:'utf8'}).trim());
          }
          NODE
          test -z "$(git diff --name-only -- package.json)"
          git diff --check
      - name: Validate actual npm ci (no scripts)
        id: install
        if: steps.validate.outcome == 'success'
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production and complete npm audit
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json --fetch-retries=0 > "$REPORT_DIR/audit-production.json"
          production_code=$?
          npm audit --json --fetch-retries=0 > "$REPORT_DIR/audit-all.json"
          complete_code=$?
          PRODUCTION_CODE="$production_code" COMPLETE_CODE="$complete_code" node <<'NODE'
          const fs = require('node:fs'), dir=process.env.REPORT_DIR;
          const prod=JSON.parse(fs.readFileSync(dir+'/audit-production.json','utf8'));
          const all=JSON.parse(fs.readFileSync(dir+'/audit-all.json','utf8'));
          const p=prod.metadata?.vulnerabilities, a=all.metadata?.vulnerabilities;
          const result={production:p,full:a,productionExit:Number(process.env.PRODUCTION_CODE),
            fullExit:Number(process.env.COMPLETE_CODE),
            remainingHigh:Object.entries(all.vulnerabilities||{}).filter(([_,v]) => ['critical','high'].includes(v.severity)).map(([name,v])=>({name,severity:v.severity})),
            remainingModerate:Object.entries(all.vulnerabilities||{}).filter(([_,v])=>v.severity==='moderate').map(([name,v])=>name)};
          fs.writeFileSync(dir+'/audit-summary.json',JSON.stringify(result,null,2)+'\n');
          console.log('DEV_HIGH_AUDIT '+JSON.stringify(result));
          if(prod.error||all.error||!p||!a||result.productionExit!==0||p.total!==0||a.high!==0||a.critical!==0||a.moderate>21||result.remainingHigh.length){
            console.error('STOP_AUDIT_FINDINGS_OR_UNAVAILABLE');process.exitCode=1;
          }
          NODE
      - name: Upload evidence without GitHub repository writes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr58-tailwind-dev-high-audit
          path: /tmp/pr58-tailwind-security/
          if-no-files-found: warn
          retention-days: 3
